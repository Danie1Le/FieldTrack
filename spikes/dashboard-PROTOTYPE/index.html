html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--font-ui); box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 72px; overflow: hidden; }
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; min-height: 0; }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; font-size: .86em; }
.muted { color: var(--muted); }
h1, h2, h3 { margin: 0; font-weight: 600; text-wrap: balance; }
.eyebrow { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* Shared: map surface, markers, pills, buttons */
.map { background: var(--map-bg); border-radius: 10px; min-height: 200px; }
.leaflet-container { background: var(--map-bg); font: inherit; }
.leaflet-control-zoom a { background: var(--panel); color: var(--fg); border-color: var(--line); }
.leaflet-tooltip { background: var(--panel); color: var(--fg); border-color: var(--line); font: 13px var(--font-ui); }
.leaflet-tooltip-top::before { border-top-color: var(--panel); }
.mk { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; font: 600 11px var(--font-ui);
  color: var(--on-solid); border: 2px solid var(--panel); box-shadow: 0 1px 4px rgba(0,0,0,.35); }
.mk-normal { background: var(--ok); }
.mk-alerting { background: var(--alert); border-radius: 4px; transform: rotate(45deg); }
.mk-alerting span { transform: rotate(-45deg); }
.mk-offline { background: var(--panel); color: var(--offline); border: 3px solid var(--offline); }
.mk-sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st-normal { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.st-alerting { color: var(--alert); background: color-mix(in srgb, var(--alert) 13%, transparent); }
.st-offline { color: var(--offline); background: color-mix(in srgb, var(--offline) 15%, transparent); }
.st-nodev { color: var(--nodev); background: color-mix(in srgb, var(--nodev) 15%, transparent); }
.as-Open { color: var(--alert); } .as-Acknowledged { color: var(--ack); } .as-Resolved { color: var(--muted); }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 11px; font-weight: 600; font-size: 13px; }
.btn:hover { border-color: var(--accent); }
.btn-solid { background: var(--accent); border-color: var(--accent); color: var(--on-solid); }
.btn-ghost { border-color: transparent; background: transparent; }
.tag { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.latch { font-size: 12px; color: var(--muted); border-left: 2px solid var(--ack); padding-left: 8px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; min-height: 0; }
.scroll { overflow: auto; min-height: 0; }
.empty { padding: 24px; color: var(--muted); text-align: center; }

/* Replay block (shared) */
.replay { display: grid; gap: 10px; min-height: 0; }
.replay-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.replay-controls input[type=range] { flex: 1 1 160px; min-width: 120px; accent-color: var(--accent); }
.charts { display: grid; gap: 8px; min-height: 0; }
.chart-box { position: relative; height: 120px; min-width: 0; }

/* Switcher (not part of the design being judged) */
#switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 2000;
  display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: #111; color: #fff;
  box-shadow: 0 6px 20px rgba(0,0,0,.4); font: 600 13px var(--font-ui); max-width: calc(100vw - 32px); }
#switcher button { background: #2a2a2a; color: #fff; border: 0; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; }
#switcher button:hover { background: #444; }
#sw-label { padding: 0 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(60px + env(safe-area-inset-bottom, 0px)); z-index: 2001;
  background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-weight: 500; max-width: calc(100vw - 32px); }

/* ===== Variant A: map first ===== */
.va { position: relative; height: 100%; }
.va .map { position: absolute; inset: 0; }
.va-top { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 900; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
.va-top > * { pointer-events: auto; }
.va-brand { background: var(--panel); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: baseline; }
.va-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.va-chip { border: 0; box-shadow: var(--shadow); background: var(--panel); border-radius: 999px; padding: 6px 12px; display: inline-flex; gap: 6px; align-items: center; font-weight: 600; }
.va-chip b { font-family: var(--font-data); font-size: 13px; }
.va-chip[aria-pressed="true"] { outline: 2px solid var(--accent); }
.va-drawer { position: absolute; top: 64px; right: 12px; bottom: 12px; width: min(360px, calc(100% - 24px)); z-index: 900;
  background: var(--panel); border-radius: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; min-height: 0; }
.va-drawer[data-collapsed="true"] { bottom: auto; }
.va-drawer[data-collapsed="true"] .va-feed { display: none; }
.va-drawer header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.va-tabs { display: flex; gap: 4px; margin-left: auto; }
.va-tabs button[aria-selected="true"] { background: var(--panel-2); border-color: var(--line); }
.va-feed { flex: 1; }
.va-alert { padding: 10px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
.va-alert:hover { background: var(--panel-2); }
.va-alert .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.va-sheet { position: absolute; left: 12px; bottom: 12px; width: min(560px, calc(100% - 24px)); z-index: 950; background: var(--panel);
  border-radius: 12px; box-shadow: var(--shadow); padding: 12px 14px; display: grid; gap: 10px; max-height: calc(100% - 90px); overflow: auto; }
.va-sheet .head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.va-sensors { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.va-sensor { background: var(--panel-2); border-radius: 8px; padding: 6px 9px; }
.va-sensor .v { font: 500 17px var(--font-data); font-variant-numeric: tabular-nums; }
@media (max-width: 720px) { .va-drawer { top: auto; height: 42%; } .va-sheet { bottom: auto; top: 64px; max-height: 50%; } }

/* ===== Variant B: control room (list | map | feed) ===== */
.vb { height: 100%; display: grid; grid-template-rows: auto 1fr; gap: 10px; min-height: 0; }
.vb-bar { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.vb-bar .sum { display: flex; gap: 14px; flex-wrap: wrap; margin-left: auto; }
.vb-grid { display: grid; grid-template-columns: minmax(300px, 1.15fr) minmax(0, 1.6fr) minmax(280px, 1fr); gap: 10px; min-height: 0; }
.vb-col { display: flex; flex-direction: column; min-height: 0; }
.vb-col > header { padding: 9px 12px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
.vb table { width: 100%; border-collapse: collapse; font-size: 13px; }
.vb th { text-align: left; font-weight: 600; color: var(--muted); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 6px 8px; position: sticky; top: 0; background: var(--panel); z-index: 1; }
.vb td { padding: 6px 8px; border-top: 1px solid var(--line); white-space: nowrap; }
.vb tr.grp td { background: var(--panel-2); font-weight: 600; font-size: 12px; }
.vb tr.asset { cursor: pointer; }
.vb tr.asset:hover td, .vb tr.asset.sel td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.vb .num { text-align: right; }
.vb .hot { color: var(--alert); font-weight: 600; }
.vb-feed-item { padding: 9px 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 4px 1fr; gap: 10px; }
.vb-feed-item .sev { border-radius: 2px; }
.sev-Critical { background: var(--alert); } .sev-Warning { background: var(--offline); }
.vb-feed-item .acts { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }

VariantC.title = "Triage queue";

/* ---------- Switcher ---------- */
const VARIANTS = { a: VariantA, b: VariantB, c: VariantC };
const KEYS = Object.keys(VARIANTS);
let current = null, cleanup = null;
function show(key) {
  if (!VARIANTS[key]) key = "a";
  if (key === current) return;
  cleanup?.(); current = key;
  const app = $("#app"); app.innerHTML = "";
  const root = document.createElement("div"); root.style.height = "100%"; app.appendChild(root);
  cleanup = VARIANTS[key](root);
  $("#sw-label").textContent = `${key.toUpperCase()} (${VARIANTS[key].title}) · ${KEYS.indexOf(key) + 1}/${KEYS.length}`;
  try { if (location.hash !== "#" + key) history.replaceState(null, "", "#" + key); } catch (e) { /* frame may refuse; the bar still works */ }
}
const step = (d) => show(KEYS[(KEYS.indexOf(current) + d + KEYS.length) % KEYS.length]);
$("#sw-prev").addEventListener("click", () => step(-1));
$("#sw-next").addEventListener("click", () => step(1));
document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1);
});
window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1) || "a");
</script>
