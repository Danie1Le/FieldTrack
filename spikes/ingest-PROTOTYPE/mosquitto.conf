# PROTOTYPE, wipe me. Mosquitto settings under test for the ingest spike.
listener 1883
allow_anonymous true
persistence false
# Per-client QoS 1 queue above the in-flight window. Default 1000 drops silently at 2,000 msg/s.
# 0 = unlimited for the spike; production would cap with max_queued_bytes / memory_limit instead.
max_queued_messages 0
# Outgoing in-flight default for clients that send no MQTT 5 Receive Maximum.
# The ingest worker sends Receive Maximum, which overrides this per client.
max_inflight_messages 100
log_dest stdout
log_type error
log_type warning
log_type notice
