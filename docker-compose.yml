# Local FieldTrack stack: `docker compose up --build -d`.
# Image tags must match tests/FieldTrack.IntegrationTests/TestImages.cs (a unit test checks).
services:
  postgres:
    # PostgreSQL 16 + PostGIS 3.6 everywhere (compose, Testcontainers, Azure) so local and cloud never drift.
    image: postgis/postgis:16-3.6
    environment:
      POSTGRES_USER: fieldtrack
      POSTGRES_PASSWORD: fieldtrack
      # The image loads PostGIS, topology and the tiger geocoder into POSTGRES_DB. Keep that in the
      # maintenance database: the API creates the fieldtrack database and its migration enables PostGIS.
      POSTGRES_DB: postgres
    ports:
      # Loopback only: the credentials are well known.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Check over TCP: the image's init phase answers only on the Unix socket, then restarts.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "fieldtrack", "-d", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  mosquitto:
    image: eclipse-mosquitto:2.1.2-alpine
    ports:
      # Loopback only: the broker allows anonymous clients.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: src/FieldTrack.Api/Dockerfile
    environment:
      # Development applies EF Core migrations on startup.
      ASPNETCORE_ENVIRONMENT: Development
      # The aspnet image has no Kerberos library; without GSS disabled Npgsql logs a libgssapi error on connect.
      ConnectionStrings__FieldTrack: Host=postgres;Database=fieldtrack;Username=fieldtrack;Password=fieldtrack;Gss Encryption Mode=Disable
      Broker__Host: mosquitto
      Broker__Port: "1883"
      # Secrets come from the shell or an untracked .env file, never from this file (#23).
      # The API refuses to start without a signing key: base64 of 32 random bytes.
      Auth__SigningKey: ${FIELDTRACK_AUTH_SIGNING_KEY:-}
      FIELDTRACK_ADMIN_EMAIL: ${FIELDTRACK_ADMIN_EMAIL:-}
      # Temporary password only: the first Admin must replace it at first sign-in (POST /auth/change-password, #61).
      FIELDTRACK_ADMIN_PASSWORD: ${FIELDTRACK_ADMIN_PASSWORD:-}
    ports:
      # Loopback only: Development serves the developer exception page over plain HTTP.
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started

  web:
    # The dashboard, served by nginx, which proxies /api/ to the api service: http://localhost:8081.
    build: web
    ports:
      # Loopback only, like the API it fronts.
      - "127.0.0.1:8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
  mosquitto-data:
