# Layer over docker-compose.yml for benchmarks (#44):
#   docker compose -f docker-compose.yml -f bench/docker-compose.bench.yml up --build -d
# Start from an empty database (`docker compose down -v`): insert cost grows with the table, and every result says how many Readings it began with.
services:
  postgres:
    command:
      - postgres
      # `bench` reads each batch's commit time from Postgres (ingest latency).
      - -c
      - track_commit_timestamp=on
      # Sized for 2,000 Readings/s: room to cache the hot partition and the Reading key index, and no WAL-forced checkpoint every few
      # minutes. It does not remove commit stalls on Docker Desktop (#44 results). Every result records these settings.
      - -c
      - shared_buffers=1GB
      - -c
      - max_wal_size=4GB
