name: Destroy demo

# Destroys infra/terraform/demo by hand from the default branch (#157, session in #51), then removes what Azure added
# to the resource group outside Terraform, so the bootstrap stack's teardown can delete the group. Records how long
# destroy takes in the job summary.
on:
  workflow_dispatch:

permissions:
  contents: read
  # The OIDC token azurerm and azure/login exchange for the apply identity's Azure token; no Azure secret is stored.
  id-token: write

# A Destroy must never be dropped (the demo keeps billing), so it has its own group: no Apply dispatch can replace a
# waiting Destroy. A newer Destroy may replace a waiting one, which does the same thing. Apply and Destroy are kept from
# changing the stack at once by the state blob's lease: Destroy waits for it (-lock-timeout below) while an Apply runs.
# (infra/terraform/demo README: Destroy)
concurrency:
  group: demo-destroy
  cancel-in-progress: false

jobs:
  destroy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    # Up to 60 minutes waiting for a running Apply's state lease, plus the destroy itself.
    timeout-minutes: 100
    defaults:
      run:
        working-directory: infra/terraform/demo
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Required by the configuration even to destroy, which never uses it, so a placeholder keeps the real one (a secret
      # only Apply demo reads) out of the logs. The image variables keep their defaults.
      TF_VAR_admin_email: admin@example.invalid
      TF_VAR_resource_group_name: ${{ vars.DEMO_RESOURCE_GROUP }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep equal to ci.yml (terraform job), terraform-plan.yml and demo-apply.yml.
          terraform_version: 1.17.0
          terraform_wrapper: false

      - name: Init
        env:
          TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
          TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
          TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
        run: |
          terraform init \
            -backend-config="resource_group_name=$TF_STATE_RESOURCE_GROUP" \
            -backend-config="storage_account_name=$TF_STATE_STORAGE_ACCOUNT" \
            -backend-config="container_name=$TF_STATE_CONTAINER"

      - name: Destroy
        run: |
          { echo "### Destroy demo"; echo "| Step | Seconds | Result |"; echo "|---|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          start=$(date +%s)
          status=0
          # Waits for the lease of an Apply that is still running (its job limit is 60 minutes) instead of failing.
          terraform destroy -auto-approve -lock-timeout=60m || status=$?
          echo "| terraform destroy | $(( $(date +%s) - start )) | $([ "$status" = 0 ] && echo ok || echo "failed ($status)") |" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Signed in only now, for the az CLI below: its token is not renewed, so it must not wait through destroy.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Application Insights may add this action group outside Terraform; left behind, it blocks the bootstrap's
      # delete of the resource group (infra/terraform/demo README: Destroy). Then nothing else may remain.
      - name: Remove what Azure added
        env:
          RESOURCE_GROUP: ${{ vars.DEMO_RESOURCE_GROUP }}
        run: |
          # The id contains spaces (the group's name), so each one is read whole and quoted, never word-split.
          az monitor action-group list --resource-group "$RESOURCE_GROUP" \
            --query "[?name=='Application Insights Smart Detection'].id" --output tsv |
          while IFS= read -r id; do
            az monitor action-group delete --ids "$id"
            echo "Deleted the action group Application Insights Smart Detection." >> "$GITHUB_STEP_SUMMARY"
          done
          left=$(az resource list --resource-group "$RESOURCE_GROUP" --query "[].[type, name]" --output tsv)
          if [ -n "$left" ]; then
            { echo "Still in $RESOURCE_GROUP:"; echo '```'; echo "$left"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$RESOURCE_GROUP still holds resources (see the summary); delete them before the bootstrap teardown."
            exit 1
          fi
          echo "$RESOURCE_GROUP is empty." >> "$GITHUB_STEP_SUMMARY"
