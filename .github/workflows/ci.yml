name: CI

on:
  # Every pull request, not only those to main, so each part of a stacked PR is checked too.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every main commit keeps its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      # Pinned by commit SHA (tags are mutable); the comment names the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Formatting per .editorconfig (the Layout options). CI only: a Windows checkout with
      # core.autocrlf has CRLF line endings, which the end_of_line = lf rule would flag.
      - name: Check formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Runs every test project in the solution; integration tests start their containers on the runner's Docker engine.
      - name: Test
        run: dotnet test --configuration Release --no-build

      # Angular 22 needs Node ^22.22.3 or ^24.15.0; keep this equal to web/Dockerfile's node image.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web packages
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build web
        working-directory: web
        run: npx ng build

      - name: Test web
        working-directory: web
        run: npx ng test --watch=false

      - name: Build images
        run: docker compose build api web
