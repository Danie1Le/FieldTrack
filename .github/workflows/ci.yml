name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test --project tests/FieldTrack.UnitTests --configuration Release --no-build

      # Testcontainers starts PostGIS and Mosquitto on the runner's Docker engine.
      - name: Integration tests
        run: dotnet test --project tests/FieldTrack.IntegrationTests --configuration Release --no-build

      - name: Build API image
        run: docker compose build api
