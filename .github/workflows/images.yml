name: Images

# Publishes the four images the Azure demo runs (infra/terraform/demo README: Images) for main commits whose CI passed,
# tagged with the commit SHA (what Apply demo deploys), main (the demo stack's default) and latest. A commit whose build
# or tests failed gets no images, so Apply demo cannot deploy it (#169). A commit superseded while its publish waits in
# the queue may be skipped (see concurrency below); Apply demo refuses a commit that has no images.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

# One publish at a time, never cancelled halfway through a push. GitHub keeps one waiting run per group and cancels an
# older waiting one, which is the skipped commit above. CI runs can finish out of order, so Push moves main and latest
# only while the commit is still main's newest; if the newest commit's CI failed, main and latest stay on the last
# newest-at-the-time green commit until the next green one.
concurrency:
  group: images
  cancel-in-progress: false

jobs:
  publish:
    name: publish (${{ matrix.image }})
    # branches matches any head branch named main, a fork pull request's too: publish only after CI passed on a push to
    # this repository's main.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Keep equal to the image list in demo-apply.yml and the *_image variables in infra/terraform/demo/variables.tf.
        include:
          - image: fieldtrack-api
            context: .
            dockerfile: src/FieldTrack.Api/Dockerfile
          - image: fieldtrack-dashboard
            context: web
            dockerfile: web/Dockerfile
          - image: fieldtrack-mosquitto
            context: docker/mosquitto/cloud
            dockerfile: docker/mosquitto/cloud/Dockerfile
          - image: fieldtrack-simulator
            context: .
            dockerfile: src/FieldTrack.Simulator/Dockerfile
    env:
      IMAGE: ${{ matrix.image }}
      CONTEXT: ${{ matrix.context }}
      DOCKERFILE: ${{ matrix.dockerfile }}
      # The commit CI tested; GITHUB_SHA is main's newest commit when this run starts, which may be a later one.
      COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      # GHCR names are lower case. The source label links the package to this repository, so later runs may push to it.
      - name: Build
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE"
          echo "REPOSITORY=$image" >> "$GITHUB_ENV"
          docker build --file "$DOCKERFILE" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$COMMIT" \
            --tag "$image:$COMMIT" \
            "$CONTEXT"

      - name: Push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$REPOSITORY:$COMMIT"
          echo "- \`$REPOSITORY:$COMMIT\`" >> "$GITHUB_STEP_SUMMARY"
          newest=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$newest" = "$COMMIT" ]; then
            for tag in main latest; do
              docker tag "$REPOSITORY:$COMMIT" "$REPOSITORY:$tag"
              docker push "$REPOSITORY:$tag"
            done
          else
            echo "main is now at $newest: main and latest stay where they are." >> "$GITHUB_STEP_SUMMARY"
          fi
