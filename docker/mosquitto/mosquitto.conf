# Mosquitto for FieldTrack, shared by docker-compose and the integration tests.
listener 1883
# Local development only: no MQTT authentication yet.
allow_anonymous true

# ADR 0004: keep the ingest worker's persistent session and its queued QoS 1 messages across
# broker restarts, and never drop queued messages while the worker is down.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 0

# TelemetryPayload.MaxPayloadBytes: larger payloads are refused by the broker and never reach ingest.
message_size_limit 4096

# The bench reads $SYS counters (publishes received, queued messages); refresh them every second instead of every 10.
sys_interval 1

log_dest stdout
log_type error
log_type warning
log_type notice
# Mosquitto 2.1 logs startup ("mosquitto version ... running") and client connects at this level;
# the integration tests wait for that startup line.
log_type information
