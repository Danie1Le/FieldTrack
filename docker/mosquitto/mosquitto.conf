# Mosquitto for the FieldTrack docker-compose stack.
listener 1883
# Local development only: no MQTT authentication yet.
allow_anonymous true

# ADR 0004: keep the ingest worker's persistent session and its queued QoS 1 messages across
# broker restarts, and never drop queued messages while the worker is down.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 0

log_dest stdout
log_type error
log_type warning
log_type notice
# Mosquitto 2.1 logs startup ("mosquitto version ... running") and client connects at this level.
log_type information
