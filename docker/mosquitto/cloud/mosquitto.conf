# Mosquitto for the Azure Container Apps demo (#154). Container Apps HTTP ingress is the only way in without a VNet: it
# terminates TLS on 443 and forwards MQTT over WebSockets to this listener (clients use wss://<app FQDN>/mqtt).
listener 8080
protocol websockets

# Only the users in the password file, which entrypoint.sh writes from the environment at every start.
allow_anonymous false
password_file /mosquitto/config/passwords

# Same as docker/mosquitto/mosquitto.conf (ADR 0004): keep the ingest worker's persistent session and its queued QoS 1
# messages across broker restarts, and never drop queued messages while the worker is down.
persistence true
persistence_location /mosquitto/data/
max_queued_messages 0

# TelemetryPayload.MaxPayloadBytes: larger payloads are refused by the broker and never reach ingest.
message_size_limit 4096

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
